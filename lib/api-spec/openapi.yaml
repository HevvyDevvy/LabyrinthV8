openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: security
    description: LabyrinthV8 security operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /security/summary:
    get:
      operationId: getSecuritySummary
      tags: [security]
      summary: Get dashboard summary
      responses:
        "200":
          description: Security dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecuritySummary"
  /security/alerts:
    get:
      operationId: getSecurityAlerts
      tags: [security]
      summary: List integrity alerts
      responses:
        "200":
          description: Recent integrity alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SecurityAlert"
  /security/requests/pending:
    get:
      operationId: getPendingRequests
      tags: [security]
      summary: List pending protection requests
      responses:
        "200":
          description: Pending human approvals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProtectionRequest"
  /security/requests/history:
    get:
      operationId: getRequestHistory
      tags: [security]
      summary: List decided protection requests
      responses:
        "200":
          description: Decided protection requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProtectionRequest"
  /security/requests/{id}/approve:
    post:
      operationId: approveProtectionRequest
      tags: [security]
      summary: Approve and protect a flagged file
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionInput"
      responses:
        "200":
          description: Approved request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionResult"
        "400":
          description: Missing approver
        "404":
          description: Request not found
  /security/requests/{id}/deny:
    post:
      operationId: denyProtectionRequest
      tags: [security]
      summary: Deny a flagged file
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionInput"
      responses:
        "200":
          description: Denied request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionResult"
        "400":
          description: Missing approver
        "404":
          description: Request not found
  /security/audit:
    get:
      operationId: getAuditTrail
      tags: [security]
      summary: Get audit chain and recent events
      responses:
        "200":
          description: Tamper-evident audit trail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditTrail"
components:
  parameters:
    RequestId:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SecuritySummary:
      type: object
      required: [pending, criticalAlerts, monitoredFiles, chainIntact, lastScan]
      properties:
        pending: { type: number, format: int32 }
        criticalAlerts: { type: number, format: int32 }
        monitoredFiles: { type: number, format: int32 }
        chainIntact: { type: boolean }
        lastScan: { type: string }
        scanInterval: { type: string }
    SecurityAlert:
      type: object
      required: [id, kind, path, detail, severity, timestamp]
      properties:
        id: { type: string }
        kind: { type: string }
        path: { type: string }
        detail: { type: string }
        severity: { type: string, enum: [critical, warning, info] }
        timestamp: { type: string }
    ProtectionRequest:
      type: object
      required: [id, path, reason, status, createdAt]
      properties:
        id: { type: string }
        path: { type: string }
        reason: { type: string }
        status: { type: string, enum: [pending, approved, denied] }
        createdAt: { type: string }
        decidedAt: { type: ["string", "null"] }
        decidedBy: { type: ["string", "null"] }
        encryptedTo: { type: ["string", "null"] }
    DecisionInput:
      type: object
      required: [approver]
      properties:
        approver: { type: string, minLength: 2 }
    DecisionResult:
      type: object
      required: [status, message]
      properties:
        status: { type: string, enum: [approved, denied] }
        message: { type: string }
        encryptedTo: { type: ["string", "null"] }
    AuditEvent:
      type: object
      required: [id, timestamp, action, target, actor, detail]
      properties:
        id: { type: string }
        timestamp: { type: string }
        action: { type: string }
        target: { type: string }
        actor: { type: string }
        detail: { type: string }
    AuditTrail:
      type: object
      required: [chainIntact, events]
      properties:
        chainIntact: { type: boolean }
        events:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"

