<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html, body {
    margin: 0; height: 100%; background: #10161c; color: #dde4ea;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { text-align: center; }
  img { width: 72px; height: 72px; border-radius: 14px; margin-bottom: 18px; }
  .title { font-size: 18px; font-weight: 600; margin-bottom: 10px; }
  .status { font-size: 12.5px; color: #7c8b9b; min-height: 16px; }
  .bar {
    width: 220px; height: 4px; background: #263140; border-radius: 2px;
    overflow: hidden; margin: 14px auto 0;
  }
  .bar-fill {
    width: 40%; height: 100%; background: #4fb3a9;
    animation: slide 1.1s ease-in-out infinite;
  }
  @keyframes slide {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }
</style>
</head>
<body>
  <div class="wrap">
    <img src="logo.png" alt="LabyrinthV8">
    <div class="title">LabyrinthV8</div>
    <div class="bar"><div class="bar-fill"></div></div>
    <div class="status" id="status">Starting local security server…</div>
  </div>
  <script>
    // Main process pushes status updates here via executeJavaScript.
    window.setSplashStatus = (text) => {
      document.getElementById("status").textContent = text;
    };
  </script>
</body>
</html>
